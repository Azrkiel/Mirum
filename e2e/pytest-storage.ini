[pytest]
# Run from the repo root: pytest -c e2e/pytest-storage.ini --tb=short -m <lifecycle|capacity|retention> e2e
# rootdir is e2e/, so paths below are relative to it. Only the R6 storage and process-control cases
# (.github/workflows/release-storage.yml) and the harness unit tests are collected; the R4 browser
# suite and test_storage_fast.py belong to release-e2e (e2e/pytest.ini).
python_files =
    test_storage_lifecycle.py
    test_storage_capacity.py
    test_storage_retention.py
    test_*_unit.py
norecursedirs = compose fixtures artifacts harness
addopts = -p no:cacheprovider --import-mode=importlib
pythonpath = .
markers =
    lifecycle: S01-S06 cancel, shutdown, deadline, crash, orphans, never-accepted (slow lane)
    capacity: S07-S09, S11 admission, write failure, capacity, legacy cleanup (slow lane)
    retention: S10, S12-S15 expiry, container replace, replay, tamper, failure views (slow lane)
