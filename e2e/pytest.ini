[pytest]
# Run from the repo root: pytest -c e2e/pytest.ini --tb=short e2e
# rootdir is e2e/, so paths below are relative to it. Only the R4 browser suite and its unit
# tests are collected; test_image_pins.py, test_ai_parity.py and test_startup_guards.py belong to
# other workflows and do not match python_files.
python_files =
    test_auth.py
    test_beam_reference.py
    test_generators.py
    test_llm_route.py
    test_negative.py
    test_offline_assets.py
    test_*_api.py
    test_dragster_browser.py
    test_*_unit.py
norecursedirs = compose fixtures artifacts harness
addopts = -p no:cacheprovider --import-mode=importlib
pythonpath = .
markers =
    browser: drives Chromium against the running release stack
