name: Build release images
description: >-
  Build the pinned backend (release with the PicoGK regen builder, b13-eval) and frontend images from a
  clean checkout, check Python 3.10.22, pip check, a no-network CadQuery STEP smoke test, an accepted
  regen reference job through the release container's API and local Babylon serving, then record image
  IDs, base digests, sizes and lock hashes as JSON. Inputs and outputs are unchanged.
inputs:
  evidence-path:
    description: File the JSON record is written to (relative to the workspace).
    required: false
    default: release-evidence/release-images.json
outputs:
  evidence-path:
    description: Path of the JSON record.
    value: ${{ inputs.evidence-path }}
runs:
  using: composite
  steps:
    # The backend images are built through picogk-builder/docker-bake.hcl so the PicoGK runtime and the
    # regen payload (named context "picogk-regen") come from the same graph and the same GitHub Actions
    # cache scopes as .github/workflows/picogk-runtime.yml. use: false keeps the plain `docker build`
    # below on the default builder (images land in the local daemon as before). No registry push.
    - name: Set up Buildx (not made the default builder)
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        use: false

    - name: Compute PicoGK cache scopes
      id: scope
      shell: bash
      run: |
        echo "rt=picogk-runtime-${{ hashFiles('spike-picogk/Dockerfile.runtime') }}" >> "$GITHUB_OUTPUT"
        echo "bd=picogk-regen-${{ hashFiles('picogk-builder/Dockerfile', 'picogk-builder/Program.cs', 'picogk-builder/builder.csproj') }}" >> "$GITHUB_OUTPUT"
        echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
        echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Build backend release and b13-eval images (PicoGK stages cached)
      uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
      env:
        BUILD_JOBS: ${{ steps.scope.outputs.jobs }}
      with:
        builder: ${{ steps.buildx.outputs.name }}
        files: picogk-builder/docker-bake.hcl
        targets: |
          backend-release
          backend-b13-eval
        load: true
        pull: true
        set: |
          runtime.cache-from=type=gha,scope=${{ steps.scope.outputs.rt }}
          runtime.cache-to=type=gha,mode=max,scope=${{ steps.scope.outputs.rt }}
          regen.cache-from=type=gha,scope=${{ steps.scope.outputs.bd }}
          regen.cache-to=type=gha,mode=max,scope=${{ steps.scope.outputs.bd }}

    - name: Record backend build time
      shell: bash
      env:
        EVIDENCE_PATH: ${{ inputs.evidence-path }}
      run: |
        mkdir -p "$(dirname "$EVIDENCE_PATH")"
        echo "{\"backend_build_seconds\": $(( $(date +%s) - ${{ steps.scope.outputs.start }} ))}" > "$(dirname "$EVIDENCE_PATH")/backend-build-time.json"

    - name: Build frontend image
      shell: bash
      run: docker build --pull --no-cache -f frontend/Dockerfile -t mirum-frontend:release .

    - name: Python version and pip check
      shell: bash
      run: |
        set -euo pipefail
        for img in mirum-backend:release mirum-backend:b13-eval mirum-frontend:release; do
          docker run --rm --network none --entrypoint python "$img" -c \
            'import sys; assert sys.version_info[:3] == (3, 10, 22), sys.version; print(sys.version)'
          docker run --rm --network none --entrypoint python "$img" -m pip check
        done

    - name: Image runs as uid 10001
      shell: bash
      run: |
        set -euo pipefail
        for img in mirum-backend:release mirum-backend:b13-eval mirum-frontend:release; do
          user=$(docker image inspect "$img" --format '{{.Config.User}}')
          echo "$img user=$user"
          case "$user" in 10001|10001:10001) ;; *) echo "unexpected user $user"; exit 1;; esac
        done

    - name: No tests or dev scripts in the release image
      shell: bash
      run: |
        set -euo pipefail
        files=$(docker run --rm --network none --entrypoint sh mirum-backend:release -c 'find /app/backend/tests -type f 2>/dev/null; ls /app/scripts 2>/dev/null; true' | sort)
        echo "$files"
        test "$files" = "/app/backend/tests/fixtures/engineering/ai-corpus-v1.json"
        docker run --rm --network none --entrypoint sh mirum-backend:b13-eval -c           'ls /app/scripts && test -f /app/backend/tests/fixtures/engineering/ai-corpus-v1.json'

    - name: CadQuery box to STEP smoke test (no network)
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm --network none --entrypoint python mirum-backend:release -c "
        import os, cadquery as cq
        from cadquery import exporters
        exporters.export(cq.Workplane('XY').box(10, 20, 30), '/tmp/smoke.step')
        size = os.path.getsize('/tmp/smoke.step')
        assert size > 1000, size
        print('STEP bytes', size)"

    - name: Backend imports with the real xfoil
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm --network none --entrypoint sh mirum-backend:release -c \
          'test -x /usr/bin/xfoil && cd /app/backend && python -c "import main"'

    - name: Regen builder is in the release image (paths, runtime sha256, libraries, uid 10001)
      shell: bash
      run: |
        set -euo pipefail
        recorded=$(cut -d' ' -f1 picogk-builder/picogk-runtime.sha256)
        docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
          --entrypoint sh -e RECORDED="$recorded" mirum-backend:release -c '
            set -eu
            test "$(id -u)" = 10001
            test -x /opt/regen/app/builder
            actual=$(sha256sum /opt/regen/app/picogk.26.2.so | cut -d" " -f1)
            echo "picogk.26.2.so sha256 $actual"
            test "$actual" = "$RECORDED"
            test "$(cut -d" " -f1 /opt/regen/app/picogk.26.2.so.sha256)" = "$actual"
            test -f /opt/regen/lib/libstdc++.so.6 && test -f /opt/regen/lib/libgcc_s.so.1
            test -f /licenses/PicoGKRuntime-LICENSE && test -f /licenses/OpenVDB-LICENSE
            ! LD_LIBRARY_PATH=/opt/regen/lib ldd /opt/regen/app/picogk.26.2.so | grep "not found"
            env | grep -c "^LD_LIBRARY_PATH=" | grep -qx 0
            python -c "import os; assert os.environ.get(\"MIRUM_DEPLOYMENT\") == \"release\""
          '

    - name: Regen smoke in the release container (read-only, no network, release env)
      shell: bash
      env:
        EVIDENCE_PATH: ${{ inputs.evidence-path }}
      run: |
        set -euo pipefail
        out_dir="$(dirname "$EVIDENCE_PATH")"
        mkdir -p "$out_dir"
        token=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')   # throwaway, never a real secret
        vol="mirum-smoke-eng-$RANDOM"
        docker volume create "$vol" >/dev/null
        # The engineering volume must be owned by uid 10001 and not group/world writable.
        docker run --rm --user 0 -v "$vol:/v" --entrypoint sh mirum-backend:release -c 'chown 10001:10001 /v && chmod 700 /v'
        cid=$(docker run -d --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
          --memory 4g --memory-swap 4g --pids-limit 512 \
          --tmpfs /tmp:rw,size=1g,mode=1777 --tmpfs /tmp/mirum/work:rw,size=2g,mode=1777 \
          --tmpfs /tmp/mirum/telemetry:rw,size=64m,mode=1777 -v "$vol:/tmp/mirum/engineering" \
          -e MIRUM_ACCESS_TOKEN="$token" -e GEMINI_API_KEY_HEAVY=offline-fixture-never-sent \
          mirum-backend:release)
        cleanup() { docker logs "$cid" > "$out_dir/regen-smoke-container.log" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true; docker volume rm -f "$vol" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        docker exec -i -e SMOKE_TOKEN="$token" -e SMOKE_SPEC="$(cat picogk-builder/examples/reference.json)" "$cid" \
          python - < scripts/regen_release_smoke.py > "$out_dir/regen-release-smoke.json" \n          || { cat "$out_dir/regen-release-smoke.json"; exit 1; }
        cat "$out_dir/regen-release-smoke.json"

    - name: Frontend serves Babylon locally
      shell: bash
      run: |
        set -euo pipefail
        cid=$(docker run -d --rm -p 127.0.0.1:18501:8501 mirum-frontend:release)
        trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 60); do
          curl -fsS http://127.0.0.1:18501/_stcore/health >/dev/null 2>&1 && break
          sleep 2
        done
        for f in babylon.js babylonjs.loaders.min.js babylonjs.materials.min.js; do
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18501/app/static/babylon/$f")
          echo "$f -> $code"
          test "$code" = 200
        done

    - name: Record digests
      shell: bash
      env:
        EVIDENCE_PATH: ${{ inputs.evidence-path }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$EVIDENCE_PATH")"
        python3 - <<'PY'
        import hashlib, json, os, re, subprocess
        def sh(*a): return subprocess.check_output(a, text=True).strip()
        def sha(p): return hashlib.sha256(open(p, 'rb').read()).hexdigest()
        base = set(re.findall(r'python:3\.10-slim-bookworm@(sha256:[0-9a-f]{64})',
                              open('backend/Dockerfile').read() + open('frontend/Dockerfile').read()))
        out = {
          'source_sha': os.environ.get('GITHUB_SHA'),
          'python_base_digest': sorted(base),
          'regen_runtime_sha256': open('picogk-builder/picogk-runtime.sha256').read().split()[0],
          'image_sizes_bytes': {t: int(sh('docker', 'image', 'inspect', t, '--format', '{{.Size}}'))
                                for t in ('mirum-backend:release', 'mirum-backend:b13-eval', 'mirum-frontend:release')},
          'images': {t: sh('docker', 'image', 'inspect', t, '--format', '{{.Id}}')
                     for t in ('mirum-backend:release', 'mirum-backend:b13-eval', 'mirum-frontend:release')},
          'lock_sha256': {p: sha(p) for p in ('requirements-release.lock', 'frontend/requirements.lock',
                                              'frontend/viewer_assets/package-lock.json')},
        }
        json.dump(out, open(os.environ['EVIDENCE_PATH'], 'w'), indent=2, sort_keys=True)
        print(json.dumps(out, indent=2, sort_keys=True))
        PY
