name: Release images

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/Dockerfile.dockerignore"
      - "picogk-builder/**"
      - "spike-picogk/Dockerfile.runtime"
      - "scripts/regen_release_smoke.py"
      - "scripts/phase3_bay_release.py"
      - "backend/engineering/equipment_bay*.py"
      - "backend/engineering/program/**"
      - "backend/vendor/mirum_kernel/**"
      - "backend/engineering/regen_*.py"
      - ".dockerignore"
      - ".github/ci-requirements/**"
      - "frontend/Dockerfile"
      - "Dockerfile.verify"
      - "requirements-*.lock"
      - "frontend/requirements.lock"
      - "frontend/viewer_assets/**"
      - "frontend/.streamlit/**"
      - "scripts/make_release_lock.py"
      - "scripts/ai_fingerprint.py"
      - "e2e/test_image_pins.py"
      - "e2e/test_fly_release.py"
      - "deploy/fly/**"
      - ".github/workflows/release-publish.yml"
      - "e2e/test_ai_parity.py"
      - "e2e/fixtures/**"
      - ".github/actions/build-release-images/**"
      - ".github/actions/build-fly-image/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

permissions: {}

jobs:
  release-images:
    name: Build pinned images, pip check, smoke, AI parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin test (stdlib only)
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/ci-requirements/pytest.lock
          echo "CI_PY=$RUNNER_TEMP/ci-venv/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pytest -q -p no:cacheprovider e2e/test_image_pins.py e2e/test_fly_release.py

      - uses: ./.github/actions/build-release-images
        id: release
        with:
          evidence-path: release-evidence/release-images.json

      - name: Verify equipment-bay publication and replay in the release image
        run: |
          set -euo pipefail
          export MIRUM_ACCESS_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          volume=$(docker volume create)
          container=
          cleanup() {
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null; fi
            docker volume rm "$volume" >/dev/null
          }
          trap cleanup EXIT
          docker run --rm --user 0 --network none --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
            -v "$volume:/v" --entrypoint sh mirum-backend:release -c 'chown 10001:10001 /v && chmod 700 /v'
          container=$(docker run -d --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --pids-limit 512 \
            --tmpfs /tmp:rw,size=256m,mode=1777 --tmpfs /tmp/mirum:rw,size=256m,uid=10001,gid=10001,mode=0700 \
            -v "$volume:/tmp/mirum/engineering" -e MIRUM_ACCESS_TOKEN -e MIRUM_ENGINEERING_PROGRAMS=1 \
            -e GEMINI_API_KEY_HEAVY=offline-fixture-never-sent mirum-backend:release)
          docker exec -i "$container" python - < scripts/phase3_bay_release.py \
            | tee release-evidence/phase3-equipment-bay.json

      # Builds and smokes the Fly variant (stage fly) in a privileged container; never pushed here.
      - uses: ./.github/actions/build-fly-image
        with:
          builder: ${{ steps.release.outputs.builder }}

      - name: Build the verification image (B13 qualified image recipe)
        run: docker build -f Dockerfile.verify -t mirum-verify:ci .

      - name: AI parity (fingerprint, qualified reference, pip freeze subset)
        env:
          MIRUM_RELEASE_IMAGE: mirum-backend:release
          MIRUM_VERIFY_IMAGE: mirum-verify:ci
        run: '"$CI_PY" -m pytest -q -p no:cacheprovider e2e/test_ai_parity.py'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-images-evidence
          path: release-evidence/
          if-no-files-found: ignore
