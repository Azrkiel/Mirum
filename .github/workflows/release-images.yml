name: Release images

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "Dockerfile.verify"
      - "requirements-*.lock"
      - "frontend/requirements.lock"
      - "frontend/viewer_assets/**"
      - "frontend/.streamlit/**"
      - "scripts/make_release_lock.py"
      - "scripts/ai_fingerprint.py"
      - "e2e/test_image_pins.py"
      - "e2e/test_ai_parity.py"
      - "e2e/fixtures/**"
      - ".github/actions/build-release-images/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

permissions: {}

jobs:
  release-images:
    name: Build pinned images, pip check, smoke, AI parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin test (stdlib only)
        run: python3 -m pytest --version >/dev/null 2>&1 || python3 -m pip install --user pytest; python3 -m pytest -q -p no:cacheprovider e2e/test_image_pins.py

      - uses: ./.github/actions/build-release-images
        with:
          evidence-path: release-evidence/release-images.json

      - name: Build the verification image (B13 qualified image recipe)
        run: docker build -f Dockerfile.verify -t mirum-verify:ci .

      - name: AI parity (fingerprint, qualified reference, pip freeze subset)
        env:
          MIRUM_RELEASE_IMAGE: mirum-backend:release
          MIRUM_VERIFY_IMAGE: mirum-verify:ci
        run: python3 -m pytest -q -p no:cacheprovider e2e/test_ai_parity.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-images-evidence
          path: release-evidence/
          if-no-files-found: ignore
