name: Release e2e

# Browser end-to-end suite against the pinned release images run through compose.release.yml.
# Runs on demand, and on a pull request only while it carries the `e2e` label. No secrets: the
# access token is generated per run, masked, and passed through the environment only.
#
# Release evidence: ONLY a workflow_dispatch run on main counts (artifact `release-e2e-artifacts`).
# Every other run (pull requests, dispatch from another branch) uploads
# `release-e2e-artifacts-nonrelease` and is never proof of a release. Pull-request runs are
# same-repo only (fork PRs would run attacker-controlled test code).

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Freeze run: also remove the stack volumes first and require a clean tree"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: release-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-e2e:
    name: Release e2e (compose + Chromium)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MIRUM_E2E_PROJECT: mirum-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Freeze run: the checkout itself must be exactly the dispatched SHA (no tracked or untracked
      # changes). Checked before the image build, which writes release-evidence/ into the workspace.
      - name: Clean tree at checkout (freeze run)
        if: inputs.clean
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD
          test -z "$(git status --porcelain --ignored --untracked-files=all)"

      - uses: ./.github/actions/build-release-images
        with:
          evidence-path: release-evidence/release-images.json

      - name: Generate run-local token
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          {
            echo "MIRUM_ACCESS_TOKEN=$token"
            echo "MIRUM_E2E_TOKEN=$token"
          } >> "$GITHUB_ENV"

      - name: Override changes only the volume name
        run: |
          set -euo pipefail
          base=$(docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml config --format json | jq -S 'del(.volumes[].name)')
          merged=$(docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml config --format json | jq -S 'del(.volumes[].name)')
          # An empty config on either side must not pass vacuously.
          { test -n "$base" && test "$base" != "null"; } || { echo "empty base compose config"; exit 1; }
          { test -n "$merged" && test "$merged" != "null"; } || { echo "empty merged compose config"; exit 1; }
          if [ "$base" != "$merged" ]; then
            diff <(echo "$base") <(echo "$merged") | sed "s/$MIRUM_E2E_TOKEN/***/g" || true
            echo "e2e override changes more than volume names"; exit 1
          fi

      # After the override is validated: the build only adds untracked evidence files.
      - name: Clean stack volumes (freeze run)
        if: inputs.clean
        run: |
          git diff --quiet HEAD
          extra=$(git status --porcelain --ignored --untracked-files=all | grep -v '^?? release-evidence/' || true)
          test -z "$extra" || { printf 'Unexpected workspace changes:\n%s\n' "$extra"; exit 1; }
          docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml down -v --remove-orphans

      - name: Start the release stack
        run: docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml up -d --wait --wait-timeout 300

      - name: Install e2e tooling (hashed lock)
        run: |
          python3 -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r e2e/requirements.lock
          echo "E2E_PY=$RUNNER_TEMP/e2e-venv/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/e2e-venv/bin/python" -m playwright install --with-deps chromium

      - name: DOM probe (selector facts for the beam page)
        run: '"$E2E_PY" e2e/probe_dom.py e2e/artifacts/probe'

      - name: Run e2e suite
        run: '"$E2E_PY" -m pytest -c e2e/pytest.ini --tb=short e2e'
        env:
          CI: "true"

      # E05 P4 (AI entry mode, no provider reachable). The module is not in pytest.ini's python_files, so the
      # steps above never collect it. Case 1 runs on the default stack (AI flag off); the stack is then replaced
      # by one with the flag on, a placeholder key and a backend on an internal network (no egress, no published
      # port). No secret is involved: the key is a literal placeholder in the override.
      - name: E05 flag-off case (default stack)
        run: '"$E2E_PY" -m pytest -c e2e/pytest.ini --tb=short e2e/test_e05_ai_offline.py -k flag_off'
        env:
          CI: "true"

      - name: Replace the stack with the E05 offline AI stack
        run: |
          docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml down --remove-orphans
          docker compose -p mirum-e2e-ai -f compose.release.yml -f e2e/compose/e05-ai-offline.override.yml up -d --wait --wait-timeout 300

      - name: E05 AI cases (offline stack)
        run: '"$E2E_PY" -m pytest -c e2e/pytest.ini --tb=short e2e/test_e05_ai_offline.py -k "not flag_off" -v'
        env:
          CI: "true"

      - name: Stop the E05 offline stack
        if: always()
        run: docker compose -p mirum-e2e-ai -f compose.release.yml -f e2e/compose/e05-ai-offline.override.yml down -v --remove-orphans || true

      # The freeze claim covers the whole run: no step may have changed a tracked file.
      - name: Tracked files unchanged at the end (freeze run)
        if: always() && inputs.clean
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && git diff --quiet HEAD

      - name: Compose logs on failure (token redacted)
        if: failure()
        run: |
          docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml ps -a || true
          docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml logs --no-color --tail 300 2>&1 \
            | sed "s/$MIRUM_E2E_TOKEN/***/g" || true
          docker compose -p mirum-e2e-ai -f compose.release.yml -f e2e/compose/e05-ai-offline.override.yml logs --no-color --tail 200 2>&1             | sed "s/$MIRUM_E2E_TOKEN/***/g" || true

      - name: Upload screenshots and evidence (PNG and JSON only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-e2e-artifacts${{ (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main') && '-nonrelease' || '' }}
          path: |
            e2e/artifacts/**/*.png
            e2e/artifacts/**/*.json
            release-evidence/*.json
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose -p "$MIRUM_E2E_PROJECT" -f compose.release.yml -f e2e/compose/e2e.override.yml down --remove-orphans || true
