name: Release docs

# Executes every `bash release-step=<id>` block of RELEASE.md, in order, in one bash session, from a
# clean checkout, exactly as a fresh operator would (it builds both images itself). Runs on demand,
# and on a pull request only while it carries the `release-docs` label. No secrets: the access token
# is generated by RELEASE.md's own `token` step, masked, and never leaves the run.
#
# Evidence: ONLY a workflow_dispatch run on main uploads `release-docs-artifacts`; every other run
# uploads `release-docs-artifacts-nonrelease`. Pull-request runs are same-repo only.
# Teardown never uses `down -v`; throwaway volumes are removed by exact name.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: release-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-docs:
    name: RELEASE.md executed from a clean checkout
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'release-docs') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: mirum-release-docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tooling RELEASE.md requires
        run: |
          for t in jq curl openssl sha256sum unzip nproc; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "${missing:-}" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq jq curl openssl unzip coreutils; fi
          docker compose version
          docker buildx version

      - name: Extract release steps
        run: |
          python3 scripts/run_release_md.py --list
          python3 scripts/run_release_md.py --emit "$RUNNER_TEMP/release-steps.sh"

      - name: Execute RELEASE.md steps
        env:
          RELEASE_WORK: ${{ runner.temp }}/mirum-release
          RELEASE_STEP_TIMING: ${{ runner.temp }}/mirum-release/release-steps.json
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_WORK"
          # Log filter: pass everything through; the artifact log gets the token (announced by
          # ::add-mask::) replaced literally, and never the mask line itself.
          bash "$RUNNER_TEMP/release-steps.sh" 2>&1 | python3 -u scripts/run_release_md.py --filter "$RELEASE_WORK/release-docs.log"

      - name: Every release step passed, in order
        run: python3 scripts/run_release_md.py --check-timing "${{ runner.temp }}/mirum-release/release-steps.json"

      - name: Compose state on failure (masked)
        if: failure()
        run: |
          export MIRUM_ACCESS_TOKEN=unused-for-inspection
          docker compose -f compose.release.yml ps -a || true
          docker compose -f compose.release.yml logs --no-color --tail 200 2>&1 || true

      - name: Upload step timing and JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-docs-artifacts${{ (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main') && '-nonrelease' || '' }}
          path: |
            ${{ runner.temp }}/mirum-release/*.json
            ${{ runner.temp }}/mirum-release/release-docs.log
            ${{ runner.temp }}/mirum-release/fingerprints
          if-no-files-found: warn

      - name: Tear down (no -v) and remove this run's throwaway volumes
        if: always()
        env:
          RELEASE_WORK: ${{ runner.temp }}/mirum-release
        run: |
          export MIRUM_ACCESS_TOKEN=unused-for-teardown
          files=(-f compose.release.yml)
          [ -f "$RELEASE_WORK/restore.compose.yml" ] && files+=(-f "$RELEASE_WORK/restore.compose.yml")
          docker compose "${files[@]}" down --remove-orphans || true
          # Only this run's restore volume, by exact pattern: <project>_mirum_engineering-restore-<16 hex>.
          # (The project's own volume is removed by exact name below.)
          if [ -f "$RELEASE_WORK/restore-volume" ]; then
            v=$(head -n1 "$RELEASE_WORK/restore-volume")
            if [[ "$v" =~ ^${COMPOSE_PROJECT_NAME}_mirum_engineering-restore-[0-9a-f]{16}$ ]]; then docker volume rm "$v" || true; fi
          fi
          docker volume rm "${COMPOSE_PROJECT_NAME}_mirum_engineering" 2>/dev/null || true
