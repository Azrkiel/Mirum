name: CI

on:
  push:
    branches: [main, "worktree-*"]
  pull_request:
    branches: [main]

env:
  # Mock XFOIL binary so Group B golden-value tests always run in CI
  # without requiring a real XFOIL installation.
  MIRUM_XFOIL_BIN: analysis/tests/mock_xfoil
  # Placeholder key — no live Gemini calls in CI test suite
  GEMINI_API_KEY_HEAVY: ci-placeholder-not-used

jobs:
  schema-tests:
    name: Schema gate (worktree-merge-gate § a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydantic (schema tests only, no cadquery)
        run: pip install pydantic

      - name: Run prompts schema tests
        run: python backend/tests/test_prompts_schema.py

      - name: Run runner filter tests
        run: python backend/tests/test_runner_filters.py

      - name: Run markdown report tests
        run: python backend/tests/test_md_report.py

      - name: PicoGK Dockerfile, lock and workflow checks (full checkout; fails if files are missing)
        run: |
          pip install --require-hashes --only-binary=:all: -r picogk-builder/requirements-test.txt
          python -m pytest -q --tb=short -p no:cacheprovider backend/tests/test_picogk_dockerfiles.py backend/tests/test_b13_step12_workflow.py

  airfoil-unit-tests:
    name: Airfoil unit tests (Group A + Group B via mock_xfoil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make mock_xfoil executable
        run: chmod +x analysis/tests/mock_xfoil

      - name: Run airfoil tests (all 24 — Group B uses mock_xfoil)
        run: python analysis/tests/test_airfoil.py

  aero-integration-tests:
    name: Aero stage integration tests (Phase 3 schema + skip contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # test_aero_integration imports backend/main.py (for _run_aero_stage),
        # which needs google-generativeai + slowapi at import time. It also
        # attaches the glider/CEM routes, which import numpy and the glider
        # solver stack eagerly. cadquery / pyrender stay lazy-imported.
        run: pip install pydantic fastapi google-generativeai slowapi numpy -r requirements-glider.lock

      - name: Run Phase 3 integration tests
        run: python backend/tests/test_aero_integration.py

  native-image:
    name: Native gate image and test collection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the native verification image
        run: docker build -f Dockerfile.verify -t mirum-integration-verify .
      - name: Collect the full offline test set (same sandbox as the gate)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none --read-only --init             --cap-drop ALL --security-opt no-new-privileges             --memory 4g --cpus 2 --tmpfs /tmp:rw,exec,size=1g,mode=1777             -v "$PWD/out:/out"             -e MIRUM_NATIVE_GATE_IMAGE=1 -e GEMINI_API_KEY_HEAVY=offline-fixture-never-sent             -e GEMINI_API_KEY= -e GOOGLE_API_KEY=             mirum-integration-verify             python scripts/ci_shard.py collect --out /out/collected.txt
          wc -l out/collected.txt
      - name: Save the image for the shards
        run: docker save mirum-integration-verify | gzip -1 > mirum-integration-verify.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-image
          path: mirum-integration-verify.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: native-collected
          path: out/collected.txt
          retention-days: 1

  native-shard:
    name: Native gate shard ${{ matrix.shard }}/3
    needs: native-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-image
      - name: Load the verification image
        run: gunzip -c mirum-integration-verify.tar.gz | docker load
      - name: Run this shard offline with real CAD and no provider network
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none --read-only --init             --cap-drop ALL --security-opt no-new-privileges             --memory 4g --cpus 2 --tmpfs /tmp:rw,exec,size=1g,mode=1777             -v "$PWD/out:/out"             -e MIRUM_NATIVE_GATE_IMAGE=1 -e GEMINI_API_KEY_HEAVY=offline-fixture-never-sent             -e GEMINI_API_KEY= -e GOOGLE_API_KEY=             mirum-integration-verify             python scripts/ci_shard.py run --shard ${{ matrix.shard }} --total 3 --out /out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn

  native-integration-sum:
    name: Native CAD and offline API regression gate
    needs: [native-image, native-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require image build and every shard to have succeeded
        env:
          IMAGE: ${{ needs.native-image.result }}
          SHARDS: ${{ needs.native-shard.result }}
        run: |
          echo "image=$IMAGE shards=$SHARDS"
          [ "$IMAGE" = success ] && [ "$SHARDS" = success ]
      - uses: actions/download-artifact@v4
        with:
          name: native-collected
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: native-shard-*
          path: reports
          merge-multiple: true
      - name: Union of executed tests must equal the collected set
        run: |
          python3 scripts/ci_shard.py check --all reports/collected.txt             reports/shard-0.json reports/shard-1.json reports/shard-2.json
