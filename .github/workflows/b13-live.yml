name: B13 live qualification (manual)

# Manual only. Spends the owner's Gemini key. Never runs on push or pull_request,
# so forks and PRs never see the secret. The secret lives in environment b13-live,
# which only main can deploy from. One key, no pool, no retries beyond the
# proposer's single schema repair. Uploads safe JSON only; the SQLite ledger,
# which keeps raw replies for local diagnosis, is never uploaded.
#
# Residual risk (accepted 2026-11-17): container egress is not restricted to
# generativelanguage.googleapis.com. The image is built from main only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic (one case, <= 2 calls) or qualification (30 cases, <= 60 calls)"
        required: true
        type: choice
        options: [diagnostic, qualification]
      run_id:
        description: "Unique run id; reserved atomically as a tag and never reused"
        required: true
        type: string
      authorization:
        description: "Owner authorization id"
        required: true
        type: string
      case_id:
        description: "Diagnostic case id"
        required: false
        default: C01
        type: string

permissions: {}

concurrency:
  group: b13-live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    environment: b13-live
    permissions:
      contents: write   # only to create the atomic reservation tag
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate inputs, enforce the total budget, reserve the run atomically
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{5,62}$ ]] || { echo "bad run_id"; exit 1; }
          [[ "$AUTHORIZATION" =~ ^[A-Za-z0-9._-]{6,80}$ ]] || { echo "bad authorization"; exit 1; }
          [[ "$CASE_ID" =~ ^[A-Z][0-9]{2}$ ]] || { echo "bad case_id"; exit 1; }
          # Cumulative cap across all runs, counted from durable reservation tags:
          # at most 6 diagnostics (<= 12 calls) and 3 qualifications (<= 60 calls each).
          # Raised 3 -> 6 on 2026-11-17 by owner direction to try each of the owner's keys.
          case "$MODE" in
            diagnostic) prefix=b13-diag; cap=6;;
            qualification) prefix=b13-qual; cap=3;;  # 1 -> 2 on 2026-11-17: owner approved a fresh paced run after HTTP 429
            # 2 -> 3 on 2026-11-17: owner Q1(b), 429/503 mark a case unavailable and the run continues
            *) exit 1;;
          esac
          used=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${prefix}-" --jq 'length')
          [ "$used" -lt "$cap" ] || { echo "${MODE} budget exhausted (${used}/${cap}); needs new owner authorization"; exit 1; }
          # Creating an existing ref fails, so a run id is never spent twice, even if
          # the job dies before uploading evidence. Tags do not expire.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${prefix}-${RUN_ID}" -f "sha=${GITHUB_SHA}" >/dev/null \
            || { echo "run_id ${RUN_ID} already reserved; never repeated"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the verification image at this commit
        run: docker build -f Dockerfile.verify -t mirum-b13-live .

      - name: Run
        env:
          KEY: ${{ secrets.B13_GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "secret B13_GEMINI_API_KEY missing"; exit 1; }
          umask 077
          cred="$RUNNER_TEMP/provider.env"
          name="b13-live-${RUN_ID}"
          trap 'rm -f "$cred"; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          printf 'GEMINI_API_KEY=%s\n' "$KEY" > "$cred"
          unset KEY
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          chmod 700 "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          image_id=$(docker image inspect mirum-b13-live --format '{{.Id}}')
          echo "image_id=$image_id sha=$GITHUB_SHA"
          # Runs as the runner uid so the 0600 credential and 0700 directories stay
          # private and the engineering store's owner check passes.
          common=(docker run --rm --init --name "$name" --read-only
            --user "$(id -u):$(id -g)"
            --cap-drop ALL --security-opt no-new-privileges
            --memory 2g --cpus 2 --pids-limit 256
            --tmpfs /tmp:rw,size=256m,mode=1777
            -v "$cred:/run/existing-provider.env:ro"
            -v "$RUNNER_TEMP/evidence:/evidence"
            -v "$RUNNER_TEMP/state:/state"
            -e HOME=/tmp
            -e GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/etc/ssl/certs/ca-certificates.crt
            -e GEMINI_API_KEY_HEAVY= -e GEMINI_API_KEY= -e GOOGLE_API_KEY=
            -e GEMINI_API_KEY_PRO= -e GEMINI_API_KEY_LITE= -e GEMINI_API_KEYS=
            mirum-b13-live)
          status=0
          if [ "$MODE" = diagnostic ]; then
            timeout --signal=TERM --kill-after=10s 180s "${common[@]}" \
              python scripts/checked_engineering_live_diagnostic.py /evidence /state /run/existing-provider.env \
              --case-id "$CASE_ID" --authorization "$AUTHORIZATION" || status=$?
          else
            timeout --signal=TERM --kill-after=10s 3600s "${common[@]}" \
              python scripts/checked_engineering_live_eval.py /evidence/live /state "$GITHUB_SHA" /run/existing-provider.env \
              --run-id "$RUN_ID" --authorization "$AUTHORIZATION" \
              --previous-run qual-20261117-hydrogen-k3-paced --image-id "$image_id" --pace-seconds 12 || status=$?
          fi
          rm -f "$cred"
          printf '{"mode":"%s","run_id":"%s","sha":"%s","image_id":"%s","exit":%d}\n' \
            "$MODE" "$RUN_ID" "$GITHUB_SHA" "$image_id" "$status" > "$RUNNER_TEMP/evidence/run.json"
          echo "exit=$status"

      - name: Upload safe evidence (JSON only, no ledger)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b13-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/evidence/**/*.json
          retention-days: 90
          if-no-files-found: warn
