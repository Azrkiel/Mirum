name: B13 live qualification (manual)

# Manual only. Spends the owner's Gemini key. Never runs on push or pull_request,
# so forks and PRs never see the secret. One key, no pool, no retries beyond the
# proposer's single schema repair. Uploads safe JSON only; the SQLite ledger,
# which keeps raw replies for local diagnosis, is never uploaded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic (one case, <= 2 calls) or qualification (30 cases, <= 60 calls)"
        required: true
        type: choice
        options: [diagnostic, qualification]
      run_id:
        description: "Unique run id; a run id that already has an artifact is refused"
        required: true
        type: string
      authorization:
        description: "Owner authorization id"
        required: true
        type: string
      case_id:
        description: "Diagnostic case id"
        required: false
        default: C01
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: b13-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate inputs and refuse a reused run id
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{5,62}$ ]] || { echo "bad run_id"; exit 1; }
          [[ "$AUTHORIZATION" =~ ^[A-Za-z0-9._-]{6,80}$ ]] || { echo "bad authorization"; exit 1; }
          [[ "$CASE_ID" =~ ^[A-Z][0-9]{2}$ ]] || { echo "bad case_id"; exit 1; }
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=b13-${RUN_ID}" --jq '.total_count')
          [ "$count" = "0" ] || { echo "run_id ${RUN_ID} already used; never repeated"; exit 1; }

      - uses: actions/checkout@v4

      - name: Build the verification image at this commit
        run: docker build -f Dockerfile.verify -t mirum-b13-live .

      - name: Run
        env:
          KEY: ${{ secrets.B13_GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "secret B13_GEMINI_API_KEY missing"; exit 1; }
          umask 077
          cred="$RUNNER_TEMP/provider.env"
          printf 'GEMINI_API_KEY=%s\n' "$KEY" > "$cred"
          unset KEY
          chmod 644 "$cred"   # readable by the container user only inside this runner
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          chmod 777 "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          image_id=$(docker image inspect mirum-b13-live --format '{{.Id}}')
          echo "image_id=$image_id sha=$GITHUB_SHA"
          common=(docker run --rm --init --read-only --memory 2g
            --tmpfs /tmp:rw,size=256m,mode=1777
            -v "$cred:/run/existing-provider.env:ro"
            -v "$RUNNER_TEMP/evidence:/evidence"
            -v "$RUNNER_TEMP/state:/state"
            -e GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/etc/ssl/certs/ca-certificates.crt
            -e GEMINI_API_KEY_HEAVY= -e GEMINI_API_KEY= -e GOOGLE_API_KEY=
            mirum-b13-live)
          status=0
          if [ "$MODE" = diagnostic ]; then
            timeout --signal=TERM --kill-after=10s 180s "${common[@]}" \
              python scripts/checked_engineering_live_diagnostic.py /evidence /state /run/existing-provider.env \
              --case-id "$CASE_ID" --authorization "$AUTHORIZATION" || status=$?
          else
            timeout --signal=TERM --kill-after=10s 3600s "${common[@]}" \
              python scripts/checked_engineering_live_eval.py /evidence/live /state "$GITHUB_SHA" /run/existing-provider.env \
              --run-id "$RUN_ID" --authorization "$AUTHORIZATION" \
              --previous-run mirum-checked-b13-live --image-id "$image_id" || status=$?
          fi
          rm -f "$cred"
          printf '{"mode":"%s","run_id":"%s","sha":"%s","image_id":"%s","exit":%d}\n' \
            "$MODE" "$RUN_ID" "$GITHUB_SHA" "$image_id" "$status" > "$RUNNER_TEMP/evidence/run.json"
          echo "exit=$status"

      - name: Upload safe evidence (JSON only, no ledger)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b13-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/evidence/**/*.json
          retention-days: 30
          if-no-files-found: warn
