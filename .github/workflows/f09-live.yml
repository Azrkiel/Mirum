name: F09 live proposal qualification (manual)

# Manual only. Spends the owner's Gemini key on the F09 MEL proposal route: three beam proposals, each at
# most the initial call plus the proposer's single schema repair, so at most 6 provider calls per run (4 for run 2, see below),
# enforced by the harness and the backend daily call cap. Never runs on push or pull_request, so forks and
# PRs never see the secret. The secret lives in environment b13-live (required reviewer, main only).
# Cumulative cap 2: each run id is reserved atomically as an f09-live- tag and never reused. Run 1
# (live-20261124-a, 2 calls) stopped at S5 because its prompt left the material reference implicit and the
# proposer correctly asked for clarification. Raised 1 -> 2 on 2026-11-24 under the same owner approval,
# with this run limited to 4 calls so both runs stay within the approved 6.
#
# Order: validate inputs, build the verification image at this commit, run the provider-free rehearsal of
# the same harness in that image, and only then take the reservation, the last step before the first
# provider call. A rehearsal failure therefore spends neither the reservation nor any call. Uploads safe
# JSON only: no prompts' replies, keys or the proposal ledger.
#
# Residual risk (accepted 2026-11-17 for b13-live, same here): container egress is not restricted to
# generativelanguage.googleapis.com. The image is built from main only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run id; reserved atomically as a tag and never reused"
        required: true
        type: string
      authorization:
        description: "Owner authorization id for this F09 live run"
        required: true
        type: string

permissions: {}

concurrency:
  group: b13-live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    environment: b13-live
    permissions:
      contents: write   # only to create the atomic reservation tag
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs and check the remaining budget
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{5,62}$ ]] || { echo "bad run_id"; exit 1; }
          [[ "$AUTHORIZATION" =~ ^[A-Za-z0-9._-]{6,80}$ ]] || { echo "bad authorization"; exit 1; }
          used=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/f09-live-" --jq 'length')
          [ "$used" -lt 2 ] || { echo "f09-live budget exhausted (${used}/2); needs new owner authorization"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the verification image at this commit
        run: docker build -f Dockerfile.verify -t mirum-f09-live .

      - name: Provider-free rehearsal in the same image (no secret, no reservation)
        env:
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rehearsal" "$RUNNER_TEMP/rehearsal-state"
          chmod 700 "$RUNNER_TEMP/rehearsal" "$RUNNER_TEMP/rehearsal-state"
          image_id=$(docker image inspect mirum-f09-live --format '{{.Id}}')
          docker run --rm --init --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            -v "$RUNNER_TEMP/rehearsal:/evidence" \
            -v "$RUNNER_TEMP/rehearsal-state:/state" \
            -e HOME=/tmp \
            -e GEMINI_API_KEY_HEAVY= -e GEMINI_API_KEY= -e GOOGLE_API_KEY= \
            -e GEMINI_API_KEY_PRO= -e GEMINI_API_KEY_LITE= -e GEMINI_API_KEYS= \
            mirum-f09-live \
            python scripts/f09_live_proposal.py --mode rehearsal \
              --evidence-dir /evidence --state-dir /state \
              --run-id "rehearsal-${RUN_ID}" --authorization "$AUTHORIZATION" \
              --source-sha "$GITHUB_SHA" --image-id "$image_id"

      - name: Reserve the run atomically (last step before the first provider call)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          used=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/f09-live-" --jq 'length')
          [ "$used" -lt 2 ] || { echo "f09-live budget exhausted (${used}/2)"; exit 1; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/f09-live-${RUN_ID}" -f "sha=${GITHUB_SHA}" >/dev/null \
            || { echo "run_id ${RUN_ID} already reserved; never repeated"; exit 1; }

      - name: Live run
        env:
          KEY: ${{ secrets.B13_GEMINI_API_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "secret B13_GEMINI_API_KEY missing"; exit 1; }
          umask 077
          cred="$RUNNER_TEMP/provider.env"
          name="f09-live-${RUN_ID}"
          trap 'rm -f "$cred"; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          printf 'GEMINI_API_KEY_HEAVY=%s\n' "$KEY" > "$cred"
          unset KEY
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          chmod 700 "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/state"
          image_id=$(docker image inspect mirum-f09-live --format '{{.Id}}')
          echo "image_id=$image_id sha=$GITHUB_SHA"
          status=0
          timeout --signal=TERM --kill-after=10s 1800s docker run --rm --init --name "$name" --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            -v "$cred:/run/existing-provider.env:ro" \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            -v "$RUNNER_TEMP/state:/state" \
            -e HOME=/tmp \
            -e GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/etc/ssl/certs/ca-certificates.crt \
            -e GEMINI_API_KEY_HEAVY= -e GEMINI_API_KEY= -e GOOGLE_API_KEY= \
            -e GEMINI_API_KEY_PRO= -e GEMINI_API_KEY_LITE= -e GEMINI_API_KEYS= \
            mirum-f09-live \
            python scripts/f09_live_proposal.py --mode live \
              --evidence-dir /evidence --state-dir /state \
              --credential-file /run/existing-provider.env \
              --run-id "$RUN_ID" --authorization "$AUTHORIZATION" \
              --source-sha "$GITHUB_SHA" --image-id "$image_id" --max-provider-calls 4 \
            || status=$?
          rm -f "$cred"
          printf '{"run_id":"%s","sha":"%s","image_id":"%s","exit":%d}\n' \
            "$RUN_ID" "$GITHUB_SHA" "$image_id" "$status" > "$RUNNER_TEMP/evidence/run.json"
          echo "exit=$status"

      - name: Upload safe evidence (JSON only, no ledger)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f09-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/rehearsal/**/*.json
            ${{ runner.temp }}/evidence/**/*.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fail the job unless the live run passed
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/evidence" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          run = json.loads((root / "run.json").read_text())
          evidence = root / "f09-live.json"
          verdict = json.loads(evidence.read_text()).get("verdict") if evidence.exists() else None
          print(f"exit={run['exit']} verdict={verdict}")
          sys.exit(0 if run["exit"] == 0 and verdict == "passed" else 1)
          PY
