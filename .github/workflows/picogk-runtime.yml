name: PicoGK runtime and regen builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "spike-picogk/Dockerfile.runtime"
      - "picogk-builder/**"
      - "backend/Dockerfile"
      - "backend/engineering/regen_*.py"
      - "backend/engineering/program/adapters/picogk.py"
      - "backend/tests/test_regen_native*.py"
      - "scripts/regen_native_evidence.py"
      - "scripts/picogk_manifest.py"
      - ".github/workflows/picogk-runtime.yml"
  pull_request:
    paths:
      - "spike-picogk/Dockerfile.runtime"
      - "picogk-builder/**"
      - "backend/Dockerfile"
      - "backend/engineering/regen_*.py"
      - "backend/engineering/program/adapters/picogk.py"
      - "backend/tests/test_regen_native*.py"
      - "scripts/regen_native_evidence.py"
      - "scripts/picogk_manifest.py"
      - ".github/workflows/picogk-runtime.yml"

permissions: {}

concurrency:
  group: picogk-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Dockerfile static checks (digest pins, optional CA, TLS)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r picogk-builder/requirements-test.txt
          python -m pytest -q -p no:cacheprovider backend/tests/test_picogk_dockerfiles.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute cache scopes
        id: scope
        run: |
          echo "rt=picogk-runtime-${{ hashFiles('spike-picogk/Dockerfile.runtime') }}" >> "$GITHUB_OUTPUT"
          echo "bd=picogk-regen-${{ hashFiles('picogk-builder/Dockerfile', 'picogk-builder/Program.cs', 'picogk-builder/builder.csproj') }}" >> "$GITHUB_OUTPUT"
          echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build runtime, regen payload and release backend image (GitHub Actions cache, no registry push)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          BUILD_JOBS: ${{ steps.scope.outputs.jobs }}
        with:
          source: .  # local checkout: a git context ignores .dockerignore (tests would ship in the image)
          files: picogk-builder/docker-bake.hcl
          targets: backend-release
          load: true
          set: |
            runtime.cache-from=type=gha,scope=${{ steps.scope.outputs.rt }}
            runtime.cache-to=type=gha,mode=max,scope=${{ steps.scope.outputs.rt }}
            regen.cache-from=type=gha,scope=${{ steps.scope.outputs.bd }}
            regen.cache-to=type=gha,mode=max,scope=${{ steps.scope.outputs.bd }}
      - name: Export runtime files from cache
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          BUILD_JOBS: ${{ steps.scope.outputs.jobs }}
        with:
          source: .  # local checkout: a git context ignores .dockerignore (tests would ship in the image)
          files: picogk-builder/docker-bake.hcl
          targets: runtime-files
          set: |
            runtime.cache-from=type=gha,scope=${{ steps.scope.outputs.rt }}
            runtime-files.output=type=local,dest=export/runtime
      - name: Record build timing
        run: |
          end=$(date +%s); start=${{ steps.scope.outputs.start }}
          mkdir -p evidence
          echo "{\"build_seconds\": $((end-start)), \"build_jobs\": ${{ steps.scope.outputs.jobs }}}" > evidence/timings.json
          cat evidence/timings.json
      - name: Real regen tests in the release image (hardened, --network none, 3 GiB cap)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r picogk-builder/requirements-test.txt --target "$RUNNER_TEMP/pt"
          set -o pipefail
          mkdir -p evidence/pytest scratch/test
          rm -f evidence/pytest/junit.xml
          chmod 777 evidence/pytest scratch/test
          docker run --rm --network none --memory 3g --memory-swap 3g --pids-limit 512 --read-only --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,size=256m,mode=1777 -e HOME=/tmp \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/pt:/pt:ro" -v "$PWD/evidence/pytest:/res" -v "$PWD/scratch/test:/work" \
            -e REGEN_NATIVE=1 -e REGEN_BUILDER=/opt/regen/app/builder -e REGEN_GCC_LIB=/opt/regen/lib -e PYTHONPATH=/app:/app/backend:/pt \
            --entrypoint python mirum-backend:release \
            -m pytest -c /dev/null -p no:cacheprovider -rA --basetemp=/work/pt --junit-xml=/res/junit.xml \
            /repo/backend/tests/test_regen_native.py /repo/backend/tests/test_regen_native_defects.py /repo/backend/tests/test_regen_native_adapter.py /repo/backend/tests/test_regen_native_k37.py /repo/backend/tests/test_regen_native_f07.py | tee evidence/pytest/pytest.txt
      - name: Require all 4 native tests to pass (skips do not count)
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("evidence/pytest/junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, bad, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "skipped"))
          errors = int(suite.get("errors", 0))
          passed = tests - bad - errors - skipped
          print(f"tests={tests} passed={passed} failures={bad} errors={errors} skipped={skipped}")
          if passed < 4 or bad or errors:
              sys.exit("native regen tests: need at least 4 passed and no failures")
          PY
      - name: Require the 5 native defect cases as well (9 of 9 passed, none skipped)
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("evidence/pytest/junit.xml").getroot()
          cases = list(root.iter("testcase"))
          ok = [c for c in cases if c.find("failure") is None and c.find("error") is None and c.find("skipped") is None]
          print(f"testcases={len(cases)} passed={len(ok)}")
          if len(ok) < 9 or len(ok) != len(cases):
              sys.exit("native regen tests: need all 9 (4 existing + 5 defect cases) passed, none skipped")
          PY
      - name: Reference and small spec evidence (exit code, wall-clock, peak RSS, hashes)
        run: |
          mkdir -p evidence/runs scratch/runs
          chmod 777 evidence/runs scratch/runs
          for spec in reference small; do
            docker run --rm --network none --memory 3g --memory-swap 3g --pids-limit 512 --read-only --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,size=256m,mode=1777 -e HOME=/tmp \
              -v "$PWD:/repo:ro" -v "$PWD/evidence/runs:/res" -v "$PWD/scratch/runs:/work" \
              -e REGEN_BUILDER=/opt/regen/app/builder -e REGEN_GCC_LIB=/opt/regen/lib \
              --entrypoint python mirum-backend:release \
              /repo/scripts/regen_native_evidence.py "/repo/picogk-builder/examples/$spec.json" "/work/o_$spec" "/res/$spec.json"
          done
      - name: Export builder, runtime and licenses
        run: |
          id=$(docker create mirum-backend:release)
          mkdir -p export/builder
          docker cp "$id:/opt/regen/app" export/builder/app
          docker cp "$id:/opt/regen/lib" export/builder/gcc-lib
          docker cp "$id:/licenses" export/builder/licenses
          docker cp "$id:/opt/regen/picogk-runtime.sha256" export/builder/picogk-runtime.sha256
          docker rm "$id" > /dev/null
          image_id=$(docker image inspect mirum-backend:release --format '{{.Id}}')
          python scripts/picogk_manifest.py export export/manifest.json "$image_id" evidence/timings.json
          cat export/manifest.json
      - name: Upload evidence (JSON only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regen-native-evidence
          path: |
            evidence/**/*.json
            evidence/pytest/pytest.txt
          retention-days: 30
      - name: Upload builder, runtime, gcc libs and licenses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regen-builder-${{ github.sha }}
          path: export
          retention-days: 14
