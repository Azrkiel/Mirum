name: tmp generate NuGet lock
on:
  push:
    branches: [rc1/r2b-picogk]
    paths: [".github/workflows/tmp-gen-lock.yml"]
permissions: {}
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: restore and write packages.lock.json
        run: |
          mkdir -p work && cp picogk-builder/Program.cs picogk-builder/builder.csproj picogk-builder/nuget.config work/
          docker run --rm -v "$PWD/work:/src" -w /src -e HOME=/tmp -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            mcr.microsoft.com/dotnet/sdk:9.0@sha256:1dfdb27e9c2c345cb598925ccf6b13719ecfebea8467bd4745c23a3c108cdf84 \
            dotnet restore builder.csproj
          cat work/packages.lock.json | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-lock
          path: work/packages.lock.json
