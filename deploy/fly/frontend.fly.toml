# Public Streamlit UI (the unchanged RC1 mirum-frontend:release image, from
# .github/workflows/release-publish.yml), deployed by digest:
#   fly deploy -c deploy/fly/frontend.fly.toml --image ghcr.io/azrkiel/mirum-frontend@sha256:<digest>
# Open access: no token gate (set MIRUM_ACCESS_GATE = "1" to re-enable).
# There is deliberately no [build] section.
app = "mirum"
primary_region = "iad"

[env]
  BACKEND_URL = "http://mirum-api.flycast"
  MIRUM_ACCESS_GATE = "0"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
