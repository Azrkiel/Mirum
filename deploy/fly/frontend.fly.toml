# Public Streamlit UI. Open access: no token gate (set MIRUM_ACCESS_GATE = "1" to re-enable).
app = "mirum"
primary_region = "iad"

[build]
  dockerfile = "frontend.Dockerfile"

[env]
  BACKEND_URL = "http://mirum-api.flycast"
  MIRUM_ACCESS_GATE = "0"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
