# Private backend: reachable only over Fly's private network (Flycast), never
# a public IP. Deploy from the repo root, see deploy/fly/README.md.
app = "mirum-api"
primary_region = "iad"

[build]
  dockerfile = "backend.Dockerfile"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
