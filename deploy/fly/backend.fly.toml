# Private backend: reachable only over Fly's private network (Flycast), never
# a public IP. Runs the RC1 release image (backend/Dockerfile target "fly"),
# published by .github/workflows/release-publish.yml and deployed by digest:
#   fly deploy -c deploy/fly/backend.fly.toml --image ghcr.io/azrkiel/mirum-backend-fly@sha256:<digest> --no-public-ips
# See deploy/fly/README.md. There is deliberately no [build] section.
app = "mirum-api"
primary_region = "iad"

[mounts]
  # 1 GB volume created once with: fly volumes create mirum_engineering --size 1 -r iad -a mirum-api
  source = "mirum_engineering"
  destination = "/data"

[env]
  # Open access: no MIRUM_ACCESS_TOKEN. The release token guard is skipped only
  # because of this exact opt-in; every other release guard stays on.
  MIRUM_OPEN_ACCESS = "1"
  # Rate limits key on the visitor address the frontend forwards in
  # X-Mirum-Client-IP. Safe ONLY because this backend is private (Flycast, no
  # public IP): only apps in the same Fly organisation (all the owner's own) can
  # reach it, so no outside visitor can forge the header. Remove this line if the
  # backend ever gets a public address, or if untrusted apps join the org.
  MIRUM_TRUSTED_CLIENT_HEADER = "1"
  # AI drafts on (owner yes 2026-11-22, after the staging live check; runbook
  # docs/runbooks/2026-11-21-ai-flag-enable.md section 5). The key is a Fly secret
  # (GEMINI_API_KEY_HEAVY), never here. Caps: at most 20 provider calls a day,
  # one at a time, and 5 AI draft requests per visitor per day.
  # Disable: set MIRUM_ENGINEERING_AI_DRAFTS = "0" and redeploy the same digest.
  # Emergency stop: MIRUM_ENGINEERING_AI_DAILY_CALLS = "0" (no provider calls).
  # The legacy /dragsters/interpret route is gated by the same flag but has its own
  # un-ledgered cap (default 200/day) outside the 20 above: keep it at "0" so the
  # 20/day cap is the only provider budget (it stays refused, as with the flag off).
  MIRUM_ENGINEERING_AI_DRAFTS = "1"
  MIRUM_ENGINEERING_AI_DAILY_CALLS = "20"
  MIRUM_ENGINEERING_AI_CONCURRENCY = "1"
  MIRUM_ENGINEERING_AI_REQUESTS_PER_CLIENT_DAY = "5"
  MIRUM_DRAGSTER_INTERPRET_DAILY_CAP = "0"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Exactly one machine: engineering storage supports a single API process
# (volume lock). Keep it at one with `fly scale count 1 -a mirum-api`.
# Dedicated CPUs (owner decision 2026-11-20): on shared-cpu-4x the regen reference
# run took 427 s and the checked regen route hit its engineering deadline; on
# performance-2x it took 107 s (CI runner: 56 s).
[[vm]]
  size = "performance-2x"
  memory = "8gb"
