services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
      - ./analysis:/opt/analysis:ro   # Phase 3: standalone XFOIL analysis package. Mounted outside /app to avoid nested-bind-mount on read-only rootfs. PYTHONPATH adds /opt in the Dockerfile.
      - backend_tmp_parts:/app/tmp_parts
      - backend_telemetry:/app/telemetry_logs
      - engineering_data:/tmp/mirum/engineering
    environment:
      MIRUM_ENGINEERING_DATA_DIR: /tmp/mirum/engineering
      WEB_CONCURRENCY: "1"
      MIRUM_API_REPLICAS: "1"
      MIRUM_ENGINEERING_REQUIRE_VOLUME: "1"
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /tmp/mirum:size=256M,uid=10001,gid=10001,mode=0700
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./frontend/app.py:/app/app.py:ro
      - ./frontend/glider_ui.py:/app/glider_ui.py:ro
      - ./frontend/glider_explorer.py:/app/glider_explorer.py:ro
      - ./frontend/vn_diagram.py:/app/vn_diagram.py:ro
      - ./frontend/engineering_ui.py:/app/engineering_ui.py:ro
      - ./frontend/engineering_state.py:/app/engineering_state.py:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_tmp_parts:
  backend_telemetry:
  engineering_data:
